<style>
  :root{
    --bg:#12151B; --text:#EDEFF3; --dim:#9AA2B1; --faint:#828A9A;
    --line:#252B35; --accent:#6CA5FF;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:var(--sans); display:grid; place-items:center; padding:24px 16px;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(90% 60% at 20% 0%, rgba(108,165,255,.10) 0%, transparent 58%),
      linear-gradient(180deg,#171C25 0%, var(--bg) 45%, #0F1219 100%);
  }
  main{position:relative; z-index:1; width:100%; max-width:520px; text-align:left}
  .brandmark{margin:0 0 40px; line-height:0}
  .brandmark img{width:min(260px,64vw); height:auto; display:block}
  .code{
    font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:16px;
  }
  h1{
    margin:0; font-size:clamp(26px,6vw,38px); font-weight:600; letter-spacing:-.025em;
    line-height:1.1;
  }
  p{margin:18px 0 0; color:var(--dim); font-size:16.5px; line-height:1.6}
  .home{
    display:inline-flex; align-items:center; gap:9px; margin-top:32px;
    font-family:var(--mono); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text); text-decoration:none; border-bottom:1px solid var(--line);
    padding-bottom:6px; transition:color .18s, border-color .18s;
  }
  .home:hover{color:var(--accent); border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:3px}
  footer{
    margin-top:52px; font-family:var(--mono); font-size:11.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--faint);
  }
</style>
